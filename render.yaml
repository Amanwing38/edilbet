services:
  - type: web
    name: edilbet
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PORT
        value: 10000
      - key: WEBAPP_URL
        value: https://edilbet.onrender.com
